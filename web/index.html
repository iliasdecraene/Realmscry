<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realmscry</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    color-scheme: dark;
    --surface-0: #111110;      /* page ground */
    --surface-1: #1a1a19;      /* cards */
    --surface-2: #232322;      /* insets, bar tracks */
    --border:    #2e2e2c;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #8a897f;
    --bar:       #3987e5;      /* single-measure damage bar */
    --you:       #e8c35a;      /* highlight for the user's own row */
    --you-glow:  rgba(232, 195, 90, .45);
    --shiny:     #7be2ff;      /* shiny drops */
    --shiny-glow: rgba(123, 226, 255, .4);
    --ench1: #3ddc55;          /* enchant-slot colors, matching the game: */
    --ench2: #24c1ff;          /* 1 green, 2 blue, 3 purple, 4 gold      */
    --ench3: #cf5bff;
    --ench4: #ffd23e;
    --bag-white:  #f5f4ef;
    --bag-orange: #d95926;
    --bag-red:    #e66767;
    --live:      #199e70;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--surface-0);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
  }
  /* The page is a fixed-height column so the loot list can flex to the
     bottom of the window; only the list itself scrolls. */
  .wrap {
    max-width: 1060px; margin: 0 auto; padding: 24px 20px;
    height: 100%; display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: baseline; gap: 14px;
    padding-bottom: 18px; margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 17px; font-weight: 650; letter-spacing: .01em;
    display: flex; align-items: center; gap: 9px;
  }
  header h1 img { width: 22px; height: 22px; image-rendering: pixelated; }
  #map { color: var(--text-secondary); font-size: 13px; }
  #conn {
    margin-left: auto; display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-muted);
  }
  #conn .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
  }
  #conn.live .dot { background: var(--live); }
  #conn.live { color: var(--text-secondary); }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    flex: 1; min-height: 0; /* cards stretch to the bottom of the window */
  }
  @media (max-width: 780px) {
    .grid { grid-template-columns: 1fr; flex: none; }
    .wrap { height: auto; min-height: 100%; }
    #loot { max-height: 70vh; }
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px 20px;
  }
  .card h2 {
    font-size: 12px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 14px;
  }
  .empty { color: var(--text-muted); font-size: 13px; padding: 18px 0 10px; }

  /* ---- Loot feed ---- */
  .sprite { image-rendering: pixelated; vertical-align: -3px; }

  .loot-card { display: flex; flex-direction: column; min-height: 0; }
  .loot-card h2 { flex: none; }
  #loot {
    flex: 1; min-height: 0; overflow-y: auto; padding-right: 6px;
    scrollbar-width: thin; scrollbar-color: var(--surface-2) transparent;
  }
  #loot::-webkit-scrollbar { width: 8px; }
  #loot::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
  #loot::-webkit-scrollbar-track { background: transparent; }

  .loot-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 0;
  }
  .loot-row + .loot-row { border-top: 1px solid var(--border); }

  /* ---- Shiny drops ---- */
  .loot-row.shiny {
    border: 1px solid var(--shiny);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 8px 0;
    box-shadow: 0 0 12px var(--shiny-glow), inset 0 0 22px rgba(123, 226, 255, .05);
  }
  .loot-row.shiny + .loot-row { border-top: none; }
  .bagwrap { position: relative; display: inline-flex; }
  .loot-row.shiny .bagwrap::after {
    content: "\2726"; /* ✦ */
    position: absolute; top: -9px; right: -6px;
    color: var(--shiny); font-size: 11px; line-height: 1;
    text-shadow: 0 0 6px var(--shiny);
    animation: twinkle 1.6s ease-in-out infinite;
  }
  .loot-row.shiny .bag-chip .sprite { filter: drop-shadow(0 0 4px var(--shiny)); }
  .itm.shiny { color: var(--shiny); }
  .itm.shiny .sprite { filter: drop-shadow(0 0 5px var(--shiny)); }
  @keyframes twinkle {
    0%, 100% { opacity: .55; transform: scale(.85) rotate(0deg); }
    50%      { opacity: 1;   transform: scale(1.2) rotate(20deg); }
  }

  /* ---- Enchantment slots (0-4 diamonds, bottom-right of the item) ---- */
  .itm.ench1 { --ec: var(--ench1); }
  .itm.ench2 { --ec: var(--ench2); }
  .itm.ench3 { --ec: var(--ench3); }
  .itm.ench4 { --ec: var(--ench4); }
  .iwrap { position: relative; display: inline-flex; flex: none; }
  /* the item itself glows in the slot-count color, like in game */
  .itm.ench1 .sprite, .itm.ench2 .sprite,
  .itm.ench3 .sprite, .itm.ench4 .sprite {
    filter: drop-shadow(0 0 4px var(--ec));
  }
  .ench {
    position: absolute; right: -6px; bottom: -5px;
    width: 16px; height: 16px; pointer-events: none;
  }
  .ench i {
    position: absolute; width: 6px; height: 6px;
    background: linear-gradient(135deg, rgba(255,255,255,.85) 0%, var(--ec) 55%);
    background-color: var(--ec);
    transform: rotate(45deg);
    outline: 1px solid rgba(0, 0, 0, .6);
    box-shadow: 0 0 4px var(--ec);
  }
  .ench.e1 i { right: 1px; bottom: 1px; width: 7px; height: 7px; }
  .ench.e2 i:nth-child(1) { left: 1px; bottom: 3px; }
  .ench.e2 i:nth-child(2) { right: 0; bottom: 3px; }
  .ench.e3 i:nth-child(1) { left: 1px; top: 2px; }
  .ench.e3 i:nth-child(2) { right: 0; top: 2px; }
  .ench.e3 i:nth-child(3) { left: 5px; bottom: 0; }
  .ench.e4 i:nth-child(1) { left: 5px; top: 0; }
  .ench.e4 i:nth-child(2) { left: 0; top: 5px; }
  .ench.e4 i:nth-child(3) { left: 10px; top: 5px; }
  .ench.e4 i:nth-child(4) { left: 5px; top: 10px; }
  .day-sep {
    display: flex; align-items: center; gap: 10px;
    margin: 16px 0 2px;
    color: var(--text-muted); font-size: 11px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .day-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .loot-row.pop { animation: lootpop .5s ease-out; }
  @keyframes lootpop {
    from { transform: translateY(-8px) scale(.97); opacity: 0; }
  }
  .loot-card { position: relative; }
  .shiny-toast {
    position: absolute; top: 10px; left: 14px; right: 14px; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--shiny); border-radius: 8px;
    padding: 10px 14px; font-weight: 600; color: var(--shiny);
    box-shadow: 0 0 20px var(--shiny-glow);
    opacity: 0; transform: translateY(-8px); pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  .shiny-toast.show { opacity: 1; transform: none; }
  .shiny-toast .sprite { width: 24px; height: 24px; }
  .bag-chip .sprite { width: 18px; height: 18px; vertical-align: -4px; }
  .itm {
    display: inline-flex; align-items: center; gap: 6px;
    margin: 2px 10px 2px 0;
  }
  .itm .sprite { width: 22px; height: 22px; flex: none; }
  .bag-chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 650; letter-spacing: .04em;
    padding: 3px 9px 3px 7px; border-radius: 999px; margin-top: 1px;
    background: var(--surface-2); color: var(--text-secondary);
  }
  .bag-chip .swatch { width: 9px; height: 9px; border-radius: 3px; }
  .bag-white  .swatch { background: var(--bag-white); }
  .bag-orange .swatch { background: var(--bag-orange); }
  .bag-red    .swatch { background: var(--bag-red); }
  .bag-shiny  .swatch { background: var(--shiny); }
  .bag-shiny { color: var(--shiny); }
  .loot-items { flex: 1; }
  .loot-items .item { font-weight: 550; }
  .loot-meta { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

  /* ---- Boss damage ---- */
  .boss-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .boss-head .sprite { width: 40px; height: 40px; flex: none; }
  .boss-name { font-size: 19px; font-weight: 650; }
  .boss-meta { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
  .p-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
  }
  .p-avatar {
    flex: none; width: 48px; align-self: stretch;
    display: flex; align-items: center; justify-content: center;
  }
  .p-avatar img { width: 44px; height: 44px; image-rendering: pixelated; }
  .p-avatar .blank {
    width: 44px; height: 44px; border-radius: 6px;
    background: var(--surface-1); border: 1px dashed var(--border);
  }
  .p-card.me .p-avatar img {
    border-radius: 6px;
    outline: 1px solid var(--you);
    box-shadow: 0 0 14px 3px var(--you-glow);
  }
  .p-card.me { border-color: var(--you); }
  .p-body { flex: 1; min-width: 0; }
  .p-top { display: flex; align-items: baseline; gap: 8px; }
  .rank {
    flex: none; color: var(--text-muted); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .pname {
    flex: 1; min-width: 0; font-weight: 550;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .you-chip {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em;
    color: var(--surface-0); background: var(--you);
    border-radius: 4px; padding: 1px 5px; margin-left: 7px; vertical-align: 1px;
  }
  .dval {
    flex: none; font-variant-numeric: tabular-nums;
    color: var(--text-secondary); font-size: 13px;
  }
  .dval .pct { color: var(--text-muted); font-size: 11px; margin-left: 6px; }
  .track {
    height: 8px; border-radius: 4px; background: var(--surface-1);
    overflow: hidden; margin: 7px 0 9px;
  }
  .fill {
    height: 100%; background: var(--bar);
    border-radius: 0 4px 4px 0; min-width: 3px;
  }
  .p-card.me .fill { background: var(--you); }
  .p-loadout { display: flex; gap: 6px; }
  .slot {
    width: 26px; height: 26px; border-radius: 5px;
    background: var(--surface-1); border: 1px solid var(--border);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .slot img { width: 20px; height: 20px; image-rendering: pixelated; }
  .slot.empty { opacity: .4; }
  .me-sep { border-top: 1px dashed var(--border); margin: 14px 2px 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img src="/favicon.png" alt="" onerror="this.remove()">Realmscry</h1>
    <span id="map"></span>
    <span id="conn"><span class="dot"></span><span id="connText">connecting…</span></span>
  </header>

  <div class="grid">
    <section class="card loot-card">
      <h2>Recent Loot</h2>
      <div class="shiny-toast" id="shinyToast"></div>
      <div id="loot"><div class="empty">No white / orange / red bags yet.</div></div>
    </section>

    <section class="card">
      <h2>Last Boss Killed</h2>
      <div id="boss"><div class="empty">No boss kills recorded yet.</div></div>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let lootLog = [];
let boss = null;

const fmt = n => {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
};
const ago = ts => {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};
const dur = ms => {
  const s = Math.round(ms / 1000);
  return s >= 60 ? Math.floor(s / 60) + "m " + (s % 60) + "s" : s + "s";
};
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let justTs = 0; // ts of a loot entry that just arrived over SSE → pop-in once

const dayKey = ts => {
  const d = new Date(ts);
  return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
};
const dayLabel = ts => {
  const d = new Date(ts), now = new Date();
  const k = dayKey(ts);
  if (k === dayKey(now.getTime())) return "Today";
  if (k === dayKey(now.getTime() - 86400000)) return "Yesterday";
  const opts = { weekday: "short", month: "short", day: "numeric" };
  if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
};

const lootRow = l => `
    <div class="loot-row${l.shiny ? " shiny" : ""}${l.ts === justTs ? " pop" : ""}">
      <span class="bag-chip bag-${l.tier}"><span class="bagwrap">${
        l.bagType ? `<img class="sprite" src="/icon/${l.bagType}" alt=""
          onerror="this.insertAdjacentHTML('afterend','&lt;span class=&quot;swatch&quot;&gt;&lt;/span&gt;');this.remove()">`
                  : '<span class="swatch"></span>'}</span>${
        (l.boosted ? "B. " : "") + l.tier.toUpperCase()}</span>
      <div class="loot-items">
        <div class="item">${l.items.map(i => {
          const n = Math.min(i.slots || 0, 4);
          return `<span class="itm${i.shiny ? " shiny" : ""}${n ? " ench" + n : ""}"${
            n ? ` title="${n} enchantment slot${n > 1 ? "s" : ""}"` : ""
          }><span class="iwrap"><img class="sprite" src="/icon/${i.id}" alt=""
             onerror="this.remove()">${
            n ? `<span class="ench e${n}">${"<i></i>".repeat(n)}</span>` : ""
          }</span>${esc(i.name)}</span>`; }).join("")}</div>
        <div class="loot-meta">${esc(l.map || "")} · ${ago(l.ts)}</div>
      </div>
    </div>`;

function renderLoot() {
  const el = $("loot");
  if (!lootLog.length) {
    el.innerHTML = '<div class="empty">No white / orange / red bags yet.</div>';
    return;
  }
  // A divider line marks each day boundary; today's group at the very top
  // needs none (the panel header covers it), but if the newest loot is
  // older, label it so the age is obvious.
  let html = "", prevKey = null;
  for (const l of lootLog) {
    const k = dayKey(l.ts);
    if (k !== prevKey && (prevKey !== null || dayLabel(l.ts) !== "Today")) {
      html += `<div class="day-sep">${dayLabel(l.ts)}</div>`;
    }
    prevKey = k;
    html += lootRow(l);
  }
  el.innerHTML = html;
  justTs = 0;
}

let toastTimer = null;
function showShinyToast(l) {
  const names = l.items.filter(i => i.shiny).map(i => esc(i.name)).join(", ");
  const icon = l.items.find(i => i.shiny);
  const t = $("shinyToast");
  t.innerHTML = `✦ Shiny drop! ${icon ? `<img class="sprite" src="/icon/${icon.id}" alt=""
    onerror="this.remove()">` : ""}<span>${names}</span>`;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 5000);
}

function renderBoss() {
  const el = $("boss");
  if (!boss) {
    el.innerHTML = '<div class="empty">No boss kills recorded yet.</div>';
    return;
  }
  // rank/loadout arrived with newer builds; default them for old snapshots.
  const rows = boss.top.map((t, i) => ({ ...t, rank: t.rank || i + 1 }));
  const main = rows.filter(r => r.rank <= 5);
  const mine = rows.filter(r => r.rank > 5); // our own below-top-5 row, if any
  const max = Math.max(1, ...rows.map(t => t.dmg));

  const slots = t => {
    const lo = t.loadout && t.loadout.length ? t.loadout : [{}, {}, {}, {}];
    return lo.map(s => s.id > 0
      ? `<span class="slot" title="${esc(s.name || "")}"><img src="/icon/${s.id}" alt=""
           onerror="this.parentElement.classList.add('empty');this.remove()"></span>`
      : '<span class="slot empty"></span>').join("");
  };
  const card = t => `
    <div class="p-card${t.me ? " me" : ""}" title="${t.dmg.toLocaleString()} damage">
      <div class="p-avatar">${t.icon > 0
        ? `<img src="/icon/${t.icon}" alt=""
             onerror="this.insertAdjacentHTML('afterend','&lt;span class=&quot;blank&quot;&gt;&lt;/span&gt;');this.remove()">`
        : '<span class="blank"></span>'}</div>
      <div class="p-body">
        <div class="p-top">
          <span class="rank">#${t.rank}</span>
          <span class="pname">${esc(t.name)}${t.me ? '<span class="you-chip">YOU</span>' : ""}</span>
          <span class="dval">${fmt(t.dmg)}<span class="pct">${
            Math.round(100 * t.dmg / boss.total)}%</span></span>
        </div>
        <div class="track"><div class="fill" style="width:${
          Math.max(2, 100 * t.dmg / max)}%"></div></div>
        <div class="p-loadout">${slots(t)}</div>
      </div>
    </div>`;

  el.innerHTML = `
    <div class="boss-head">
      ${boss.icon > 0 ? `<img class="sprite" src="/icon/${boss.icon}" alt=""
        onerror="this.remove()">` : ""}
      <div>
        <div class="boss-name">${esc(boss.name)}</div>
        <div class="boss-meta">${fmt(boss.total)} total tracked damage · fight ${
          dur(boss.fightMs)} · ${esc(boss.map || "")} · ${ago(boss.ts)}</div>
      </div>
    </div>` +
    main.map(card).join("") +
    (mine.length ? '<div class="me-sep"></div>' + mine.map(card).join("") : "");
}

function setMap(name) {
  $("map").textContent = name || "";
}

function connect() {
  const es = new EventSource("/events");
  es.onopen = () => {
    $("conn").classList.add("live");
    $("connText").textContent = "live";
  };
  es.onerror = () => {
    $("conn").classList.remove("live");
    $("connText").textContent = "reconnecting…";
  };
  es.addEventListener("snapshot", e => {
    const d = JSON.parse(e.data);
    lootLog = d.loot || [];
    boss = d.boss || null;
    setMap(d.map);
    renderLoot(); renderBoss();
  });
  es.addEventListener("loot", e => {
    const d = JSON.parse(e.data);
    lootLog.unshift(d);
    if (lootLog.length > 2000) lootLog.pop();
    justTs = d.ts;
    renderLoot();
    if (d.shiny) showShinyToast(d);
  });
  es.addEventListener("boss", e => {
    boss = JSON.parse(e.data);
    renderBoss();
  });
  es.addEventListener("map", e => setMap(JSON.parse(e.data).map));
}
connect();
setInterval(() => { renderLoot(); if (boss) renderBoss(); }, 30000);
</script>
</body>
</html>
