<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realmscry</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    color-scheme: dark;
    --surface-0: #111110;      /* page ground */
    --surface-1: #1a1a19;      /* cards */
    --surface-2: #232322;      /* insets, bar tracks */
    --border:    #2e2e2c;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #8a897f;
    --bar:       #3987e5;      /* single-measure damage bar */
    --you:       #e8c35a;      /* highlight for the user's own row */
    --you-glow:  rgba(232, 195, 90, .45);
    --shiny:     #7be2ff;      /* shiny drops */
    --shiny-glow: rgba(123, 226, 255, .4);
    --ench1: #3ddc55;          /* enchant-slot colors, matching the game: */
    --ench2: #24c1ff;          /* 1 green, 2 blue, 3 purple, 4 gold      */
    --ench3: #cf5bff;
    --ench4: #ffd23e;
    --bag-white:  #f5f4ef;
    --bag-orange: #d95926;
    --bag-red:    #e66767;
    --live:      #199e70;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; } /* beats display:flex/grid rules */
  html, body { height: 100%; }
  body {
    background: var(--surface-0);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
  }
  /* The page is a fixed-height column so the loot list can flex to the
     bottom of the window; only the list itself scrolls. */
  .wrap {
    max-width: 1060px; margin: 0 auto; padding: 24px 20px;
    height: 100%; display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: baseline; gap: 14px;
    padding-bottom: 18px; margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 17px; font-weight: 650; letter-spacing: .01em;
    display: flex; align-items: center; gap: 9px;
  }
  header h1 img { width: 22px; height: 22px; image-rendering: pixelated; }

  /* ---- View tabs (Tracker | Guild) ---- */
  .tabs { display: flex; gap: 4px; margin-left: 18px; }
  .tabs button {
    border: none; background: none; color: var(--text-muted);
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
  }
  .tabs button:hover { color: var(--text-secondary); }
  .tabs button.on { background: var(--surface-2); color: var(--text-primary); }

  /* ---- Segmented filter (All | Liked | Deaths) ---- */
  .card-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .card-head h2 { margin-bottom: 0; }
  .seg { display: flex; gap: 2px; margin-left: auto; }
  .seg button {
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-muted); font: inherit; font-size: 11px; font-weight: 650;
    letter-spacing: .04em; padding: 3px 10px; cursor: pointer;
  }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: var(--surface-2); color: var(--text-primary); }
  #map { color: var(--text-secondary); font-size: 13px; }
  #conn {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-muted);
  }

  /* ---- Party ---- */
  .acct-btn {
    margin-left: auto; margin-right: 16px;
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600;
    padding: 4px 11px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-secondary); cursor: pointer; user-select: none;
  }
  .acct-btn:hover { border-color: var(--text-muted); }
  .acct-pop {
    position: absolute; top: 54px; right: 120px; z-index: 20; width: 170px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px;
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  .acct-pop button {
    display: block; width: 100%; text-align: left;
    border: none; background: none; color: var(--text-secondary);
    font: inherit; font-size: 13px; padding: 8px 12px;
    border-radius: 6px; cursor: pointer;
  }
  .acct-pop button:hover { background: var(--surface-2); color: var(--text-primary); }
  .acct-pop button:disabled { color: var(--text-muted); cursor: default; }
  .acct-pop button:disabled:hover { background: none; }
  .acct-view { display: flex; justify-content: center; padding-top: 30px; }
  .acct-card { width: 100%; max-width: 460px; }
  .acct-card input {
    width: 100%; margin: 10px 0; padding: 9px 11px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text-primary); font: inherit; font-size: 14px;
  }
  .acct-ok { color: var(--live); font-size: 12px; margin-top: 8px; min-height: 15px; }
  .setting-row {
    display: flex; gap: 12px; align-items: flex-start;
    margin-top: 12px; cursor: pointer; font-size: 13.5px;
    color: var(--text-secondary);
  }
  .setting-row b { color: var(--text-primary); font-weight: 650; }
  .setting-row input { margin-top: 3px; accent-color: var(--bar); }
  .party-pop {
    position: absolute; top: 54px; right: 0; z-index: 20; width: 270px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  .party-pop h3 {
    font-size: 11px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px;
  }
  .party-pop input {
    width: 100%; margin-bottom: 8px; padding: 7px 10px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text-primary); font: inherit; font-size: 13px;
  }
  .party-pop input:focus { outline: 1px solid var(--bar); }
  .party-btns { display: flex; gap: 8px; margin-top: 2px; }
  .party-btns button {
    flex: 1; padding: 7px 0; border: none; border-radius: 6px;
    font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
    background: var(--bar); color: #fff;
  }
  .party-btns button.ghost {
    background: var(--surface-2); color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .party-btns button.danger { background: #a33; }
  .party-code-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .party-code {
    font-size: 20px; font-weight: 700; letter-spacing: .18em;
    color: var(--text-primary); cursor: pointer;
  }
  .party-code-row .hint { font-size: 11px; color: var(--text-muted); }
  .party-member {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; padding: 3px 0; color: var(--text-secondary);
  }
  .party-member .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
  .party-member.you-row { color: var(--text-primary); font-weight: 600; }
  .party-err { color: #e66767; font-size: 12px; margin-top: 6px; }
  .from-chip {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em;
    color: var(--surface-0); background: var(--live);
    border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px;
  }
  .pb-card {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; margin-top: 7px;
  }
  .pb-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .pb-head img { width: 28px; height: 28px; image-rendering: pixelated; flex: none; }
  .pb-name { font-weight: 600; font-size: 13px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pb-line { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .pb-who { flex: none; width: 92px; font-size: 12px; color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pb-line.me .pb-who { color: var(--you); font-weight: 650; }
  .pb-line .track { flex: 1; margin: 0; }
  .pb-line .fill { background: var(--bar); }
  .pb-line.me .fill { background: var(--you); }
  .pb-nums { flex: none; font-size: 12px; color: var(--text-secondary);
    font-variant-numeric: tabular-nums; }
  .pb-nums .pct { color: var(--text-muted); font-size: 11px; margin-left: 5px; }
  .pb-rank { flex: none; width: 30px; text-align: right; font-size: 11px;
    font-weight: 700; color: var(--text-muted); }
  .pb-line.me .pb-rank { color: var(--you); }
  #conn .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
  }
  #conn.live .dot { background: var(--live); }
  #conn.live { color: var(--text-secondary); }

  .grid {
    display: grid; grid-template-columns: 128px 1fr 1fr; gap: 20px;
    flex: 1; min-height: 0; /* cards stretch to the bottom of the window */
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; flex: none; }
    .wrap { height: auto; min-height: 100%; }
    #loot { max-height: 70vh; }
    .party-side { flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
  }

  /* ---- Party sidebar (tracker view only) ---- */
  .party-side {
    display: flex; flex-direction: column; gap: 10px;
    position: relative; min-height: 0;
  }
  .party-btn {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-1); color: var(--text-secondary);
    font: inherit; font-size: 12.5px; font-weight: 650;
    padding: 10px 8px; cursor: pointer; text-align: center;
  }
  .party-btn:hover { border-color: var(--text-muted); }
  .party-btn.in { color: var(--live); border-color: var(--live); }
  .party-side .party-pop { top: 44px; left: 0; right: auto; width: 260px; }
  .party-side .pm-tile { width: 100%; }
  #partyTiles {
    display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto; min-height: 0;
  }
  @media (max-width: 900px) { #partyTiles { flex-direction: row; flex-wrap: wrap; } }
  @media (max-width: 900px) {
    .party-side .party-btn { width: auto; padding: 10px 16px; }
    .party-side .pm-tile { width: auto; }
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px 20px;
  }
  .card h2 {
    font-size: 12px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 14px;
  }
  .empty { color: var(--text-muted); font-size: 13px; padding: 18px 0 10px; }

  /* ---- Loot feed ---- */
  .sprite { image-rendering: pixelated; vertical-align: -3px; }

  .col-left { display: flex; flex-direction: column; gap: 20px; min-height: 0; }
  .loot-card { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .loot-card h2 { flex: none; }

  /* ---- Party roster (top-left, one tile per member) ---- */
  .roster-card { flex: none; padding: 14px 16px 12px; }
  .roster { display: flex; flex-wrap: wrap; gap: 10px; }
  .pm-tile {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: 2px solid var(--border); border-radius: 8px;
    padding: 8px 10px 6px; min-width: 66px;
    background: var(--surface-2);
  }
  .pm-ava {
    width: 36px; height: 36px; border-radius: 6px;
    background: var(--surface-1);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pm-ava img { width: 34px; height: 34px; image-rendering: pixelated; }
  .pm-name {
    font-size: 11px; font-weight: 650; max-width: 86px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pm-you { font-size: 9px; font-weight: 700; letter-spacing: .08em; color: var(--text-muted); }
  #loot {
    flex: 1; min-height: 0; overflow-y: auto; padding-right: 6px;
    scrollbar-width: thin; scrollbar-color: var(--surface-2) transparent;
  }
  #loot::-webkit-scrollbar { width: 8px; }
  #loot::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
  #loot::-webkit-scrollbar-track { background: transparent; }

  .loot-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 0;
  }
  .loot-row + .loot-row { border-top: 1px solid var(--border); }

  /* ---- Shiny drops ---- */
  .loot-row.shiny {
    border: 1px solid var(--shiny);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 8px 0;
    box-shadow: 0 0 12px var(--shiny-glow), inset 0 0 22px rgba(123, 226, 255, .05);
  }
  .loot-row.shiny + .loot-row { border-top: none; }
  .bagwrap { position: relative; display: inline-flex; }
  .loot-row.shiny .bagwrap::after {
    content: "\2726"; /* ✦ */
    position: absolute; top: -9px; right: -6px;
    color: var(--shiny); font-size: 11px; line-height: 1;
    text-shadow: 0 0 6px var(--shiny);
    animation: twinkle 1.6s ease-in-out infinite;
  }
  .loot-row.shiny .bag-chip .sprite { filter: drop-shadow(0 0 4px var(--shiny)); }
  .itm.shiny { color: var(--shiny); }
  .itm.shiny .sprite { filter: drop-shadow(0 0 5px var(--shiny)); }
  @keyframes twinkle {
    0%, 100% { opacity: .55; transform: scale(.85) rotate(0deg); }
    50%      { opacity: 1;   transform: scale(1.2) rotate(20deg); }
  }

  /* ---- Enchantment slots (0-4 diamonds, bottom-right of the item) ---- */
  .itm.ench1 { --ec: var(--ench1); }
  .itm.ench2 { --ec: var(--ench2); }
  .itm.ench3 { --ec: var(--ench3); }
  .itm.ench4 { --ec: var(--ench4); }
  .iwrap { position: relative; display: inline-flex; flex: none; }
  /* the item itself glows in the slot-count color, like in game */
  .itm.ench1 .sprite, .itm.ench2 .sprite,
  .itm.ench3 .sprite, .itm.ench4 .sprite {
    filter: drop-shadow(0 0 4px var(--ec));
  }
  .ench {
    position: absolute; right: -6px; bottom: -5px;
    width: 16px; height: 16px; pointer-events: none;
  }
  .ench i {
    position: absolute; width: 6px; height: 6px;
    background: linear-gradient(135deg, rgba(255,255,255,.85) 0%, var(--ec) 55%);
    background-color: var(--ec);
    transform: rotate(45deg);
    outline: 1px solid rgba(0, 0, 0, .6);
    box-shadow: 0 0 4px var(--ec);
  }
  .ench.e1 i { right: 1px; bottom: 1px; width: 7px; height: 7px; }
  .ench.e2 i:nth-child(1) { left: 1px; bottom: 3px; }
  .ench.e2 i:nth-child(2) { right: 0; bottom: 3px; }
  .ench.e3 i:nth-child(1) { left: 1px; top: 2px; }
  .ench.e3 i:nth-child(2) { right: 0; top: 2px; }
  .ench.e3 i:nth-child(3) { left: 5px; bottom: 0; }
  .ench.e4 i:nth-child(1) { left: 5px; top: 0; }
  .ench.e4 i:nth-child(2) { left: 0; top: 5px; }
  .ench.e4 i:nth-child(3) { left: 10px; top: 5px; }
  .ench.e4 i:nth-child(4) { left: 5px; top: 10px; }
  .day-sep {
    display: flex; align-items: center; gap: 10px;
    margin: 16px 0 2px;
    color: var(--text-muted); font-size: 11px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .day-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .loot-row.pop { animation: lootpop .5s ease-out; }
  @keyframes lootpop {
    from { transform: translateY(-8px) scale(.97); opacity: 0; }
  }
  .loot-card { position: relative; }
  .shiny-toast {
    position: absolute; top: 10px; left: 14px; right: 14px; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--shiny); border-radius: 8px;
    padding: 10px 14px; font-weight: 600; color: var(--shiny);
    box-shadow: 0 0 20px var(--shiny-glow);
    opacity: 0; transform: translateY(-8px); pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  .shiny-toast.show { opacity: 1; transform: none; }
  .shiny-toast .sprite { width: 24px; height: 24px; }
  .bag-chip .sprite { width: 18px; height: 18px; vertical-align: -4px; }
  .itm {
    display: inline-flex; align-items: center; gap: 6px;
    margin: 2px 10px 2px 0;
  }
  .itm .sprite { width: 22px; height: 22px; flex: none; }
  .bag-chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 650; letter-spacing: .04em;
    padding: 3px 9px 3px 7px; border-radius: 999px; margin-top: 1px;
    background: var(--surface-2); color: var(--text-secondary);
  }
  .bag-chip .swatch { width: 9px; height: 9px; border-radius: 3px; }
  .bag-white  .swatch { background: var(--bag-white); }
  .bag-orange .swatch { background: var(--bag-orange); }
  .bag-red    .swatch { background: var(--bag-red); }
  .bag-shiny  .swatch { background: var(--shiny); }
  .bag-shiny { color: var(--shiny); }
  .loot-items { flex: 1; }
  .loot-items .item { font-weight: 550; }
  .loot-meta { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

  /* ---- Boss damage ---- */
  .boss-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .boss-head .sprite { width: 40px; height: 40px; flex: none; }
  .boss-name { font-size: 19px; font-weight: 650; }
  .boss-meta { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
  .p-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
  }
  .p-avatar {
    flex: none; width: 48px; align-self: stretch;
    display: flex; align-items: center; justify-content: center;
  }
  .p-avatar img { width: 44px; height: 44px; image-rendering: pixelated; }
  .p-avatar .blank {
    width: 44px; height: 44px; border-radius: 6px;
    background: var(--surface-1); border: 1px dashed var(--border);
  }
  .p-card.me .p-avatar img {
    border-radius: 6px;
    outline: 1px solid var(--you);
    box-shadow: 0 0 14px 3px var(--you-glow);
  }
  .p-card.me { border-color: var(--you); }
  .p-body { flex: 1; min-width: 0; }
  .p-top { display: flex; align-items: baseline; gap: 8px; }
  .rank {
    flex: none; color: var(--text-muted); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .pname {
    flex: 1; min-width: 0; font-weight: 550;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .you-chip {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em;
    color: var(--surface-0); background: var(--you);
    border-radius: 4px; padding: 1px 5px; margin-left: 7px; vertical-align: 1px;
  }
  .dval {
    flex: none; font-variant-numeric: tabular-nums;
    color: var(--text-secondary); font-size: 13px;
  }
  .dval .pct { color: var(--text-muted); font-size: 11px; margin-left: 6px; }
  .track {
    height: 8px; border-radius: 4px; background: var(--surface-1);
    overflow: hidden; margin: 7px 0 9px;
  }
  .fill {
    height: 100%; background: var(--bar);
    border-radius: 0 4px 4px 0; min-width: 3px;
  }
  .p-card.me .fill { background: var(--you); }
  .p-loadout { display: flex; gap: 6px; }
  .slot {
    width: 26px; height: 26px; border-radius: 5px;
    background: var(--surface-1); border: 1px solid var(--border);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .slot img { width: 20px; height: 20px; image-rendering: pixelated; }
  .slot.empty { opacity: .4; }
  .me-sep { border-top: 1px dashed var(--border); margin: 14px 2px 6px; }

  /* ---- Death cards ---- */
  .death-row {
    border: 1px solid #6d2b2b; border-radius: 8px;
    background: rgba(160, 45, 45, .07);
    padding: 10px 12px; margin: 8px 0;
  }
  .death-row + .loot-row { border-top: none; }
  .d-head { display: flex; align-items: center; gap: 10px; }
  .d-skull { font-size: 15px; }
  .d-ava { width: 34px; height: 34px; image-rendering: pixelated; flex: none; }
  .d-who { flex: 1; min-width: 0; }
  .d-name { font-weight: 650; }
  .d-cause { color: var(--text-secondary); font-size: 12px; }
  .d-cause b { color: #e66767; font-weight: 650; }
  .d-badges { display: flex; gap: 6px; flex: none; align-items: center; }
  .d-badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .d-badge.maxed8 { color: var(--you); border-color: var(--you); }
  .d-gear { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .d-gear .slot { width: 24px; height: 24px; }
  .d-gear .slot img { width: 18px; height: 18px; }
  .d-gear .gsep { width: 1px; background: var(--border); margin: 2px 3px; }

  /* ---- Guild view ---- */
  .guild-view { display: flex; flex-direction: column; gap: 20px; flex: 1; min-height: 0; }
  .guild-forms { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 780px) { .guild-forms { grid-template-columns: 1fr; } }
  .guild-forms input {
    width: 100%; margin: 8px 0; padding: 8px 10px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text-primary); font: inherit; font-size: 13px;
  }
  .guild-forms button, .g-btn {
    border: none; border-radius: 6px; background: var(--bar); color: #fff;
    font: inherit; font-size: 12.5px; font-weight: 650;
    padding: 8px 16px; cursor: pointer;
  }
  .g-btn.ghost { background: var(--surface-2); color: var(--text-secondary);
    border: 1px solid var(--border); }
  .g-hint { color: var(--text-muted); font-size: 12px; margin-top: 8px; }
  .g-err { color: #e66767; font-size: 12px; margin-top: 8px; min-height: 15px; }
  .g-info { flex: none; }
  .g-info-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .g-name { font-size: 17px; font-weight: 700; }
  .g-code {
    font-weight: 700; letter-spacing: .14em; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 10px; font-size: 13px;
  }
  .g-roster { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .g-member {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 12px 3px 5px; font-size: 12px;
    color: var(--text-secondary);
  }
  .g-member img { width: 22px; height: 22px; image-rendering: pixelated; }
  .g-member .crown { color: var(--you); }
  .g-tl-card { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #gtl {
    flex: 1; min-height: 0; overflow-y: auto; padding-right: 6px;
    scrollbar-width: thin; scrollbar-color: var(--surface-2) transparent;
  }
  .g-ev { border-top: 1px solid var(--border); padding: 8px 0 2px; }
  .g-ev:first-child { border-top: none; }
  .g-ev-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-secondary);
  }
  .g-ev-head img { width: 20px; height: 20px; image-rendering: pixelated; }
  .g-ev-head .gname { font-weight: 650; }
  .g-ev-head .gago { color: var(--text-muted); margin-left: auto; }
  .heart {
    border: none; background: none; cursor: pointer; font: inherit;
    font-size: 13px; color: var(--text-muted); padding: 2px 6px;
    border-radius: 6px; flex: none;
  }
  .heart:hover { background: var(--surface-2); }
  .heart.liked { color: #f06292; }
  .tl-heart { align-self: flex-start; margin-top: 2px; }
  .g-ev .loot-row, .g-ev .death-row { margin: 2px 0 6px; }

  /* ---- Your recent bosses (collapsible personal history) ---- */
  .bl-toggle {
    display: flex; align-items: center; gap: 8px;
    margin-top: 18px; padding: 8px 2px 2px;
    border-top: 1px solid var(--border);
    font-size: 12px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-muted);
    cursor: pointer; user-select: none;
  }
  .bl-toggle:hover { color: var(--text-secondary); }
  .bl-toggle .chev { transition: transform .15s ease; font-size: 10px; }
  .bl-toggle.open .chev { transform: rotate(180deg); }
  .bl-toggle .bl-count { margin-left: auto; font-weight: 500; letter-spacing: 0; }
  .bl-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    margin-top: 7px;
  }
  .bl-row .bl-icon {
    flex: none; width: 34px; height: 34px; image-rendering: pixelated;
  }
  .bl-row .blank34 {
    flex: none; width: 34px; height: 34px; border-radius: 6px;
    background: var(--surface-1); border: 1px dashed var(--border);
  }
  .bl-body { flex: 1; min-width: 0; }
  .bl-topline { display: flex; align-items: baseline; gap: 8px; }
  .bl-name {
    flex: 1; min-width: 0; font-weight: 550; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rank-chip {
    flex: none; font-size: 11px; font-weight: 700;
    color: var(--you); font-variant-numeric: tabular-nums;
  }
  .bl-row .track { margin: 6px 0 0; }
  .bl-row .fill { background: var(--you); }
  .bl-ago { color: var(--text-muted); font-size: 11px; flex: none; }
</style>
</head>
<body>
<div class="wrap">
  <header style="position:relative">
    <h1><img src="/favicon.png" alt="" onerror="this.remove()">Realmscry</h1>
    <nav class="tabs">
      <button id="navTracker" class="on" onclick="setView('tracker')">Tracker</button>
      <button id="navGuild" onclick="setView('guild')">Guild</button>
    </nav>
    <span id="map"></span>
    <span class="acct-btn" onclick="toggleAcctPop()">Account ▾</span>
    <span id="conn"><span class="dot"></span><span id="connText">connecting…</span></span>
    <div class="acct-pop" id="acctPop" hidden>
      <button onclick="toggleAcctPop();setView('account')">Account</button>
      <button onclick="toggleAcctPop();setView('settings')">Settings</button>
    </div>
  </header>

  <div class="grid" id="viewTracker">
    <div class="party-side">
      <button class="party-btn" id="partyChip" onclick="togglePartyPop()">Party</button>
      <div class="party-pop" id="partyPop" hidden></div>
      <div id="partyTiles"></div>
    </div>
    <div class="col-left">
      <section class="card loot-card">
        <div class="card-head">
          <h2>Timeline</h2>
          <div class="seg" id="tlSeg">
            <button class="on" data-f="all" onclick="setTlFilter('all')">All</button>
            <button data-f="liked" onclick="setTlFilter('liked')">Liked</button>
            <button data-f="deaths" onclick="setTlFilter('deaths')">Deaths</button>
          </div>
        </div>
        <div class="shiny-toast" id="shinyToast"></div>
        <div id="loot"><div class="empty">No drops yet.</div></div>
      </section>
    </div>

    <section class="card">
      <h2>Last Boss Killed</h2>
      <div id="boss"><div class="empty">No boss kills recorded yet.</div></div>
    </section>
  </div>

  <div class="guild-view" id="viewGuild" hidden></div>

  <div class="acct-view" id="viewAccount" hidden>
    <section class="card acct-card">
      <h2>Account</h2>
      <div class="g-hint">The name shown to your guild and on your shared
        drops and deaths. Your in-game name is detected automatically once
        you enter a map — this overrides it.</div>
      <input id="acctName" maxlength="24" placeholder="Display name">
      <button class="g-btn" onclick="saveAcctName()">Save</button>
      <div class="acct-ok" id="acctOk"></div>
      <div class="g-hint" id="acctIgn"></div>
    </section>
  </div>

  <div class="acct-view" id="viewSettings" hidden>
    <section class="card acct-card">
      <h2>Settings</h2>
      <label class="setting-row">
        <input type="checkbox" id="setAutoLaunch" onchange="toggleAutoLaunch()">
        <span><b>Launch with the game</b><br>
          <span class="g-hint" style="margin-top:2px">Starts Realmscry
            automatically whenever Realm of the Mad God starts. Installs a
            tiny watcher in your Windows Startup folder; untick to remove
            it. If you move Realmscry.jar, re-tick to update the path.</span>
        </span>
      </label>
      <div class="acct-ok" id="setOk"></div>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let lootLog = [];
let boss = null;
let bossLog = [];          // your own line for the 5 most recent kills
let bossLogOpen = true;    // dropdown state survives re-renders
let party = { joined: false, connected: false, code: "", name: "", id: "", members: [], events: [] };
let partyPopOpen = false;
const partySeen = new Set();
let view = "tracker";      // "tracker" | "guild"
let tlFilter = "all";      // local timeline: "all" | "deaths"
// Guild state lives on the backend; the jar proxies /guild/* for us.
let guild = { loaded: false, inGuild: false, name: "", code: "", role: "",
              accountId: "", members: [], filter: "all", events: [], error: "" };

// Member colors: gold is always "you"; everyone else gets a stable palette
// color by their position in the sorted member-id list (identical on every
// member's screen). Authors who already left fall back to an id hash.
const YOU_COLOR = "#e8c35a";
const PM_PALETTE = ["#4fc3f7", "#81c784", "#ba68c8", "#ff8a65",
                    "#f06292", "#4db6ac", "#9575cd", "#90a4ae"];
const hashStr = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); };
function memberColor(id) {
  if (!id) return null;
  if (id === party.id) return YOU_COLOR;
  const others = party.members.filter(m => m.id !== party.id).map(m => m.id).sort();
  const i = others.indexOf(id);
  return PM_PALETTE[(i >= 0 ? i : hashStr(id)) % PM_PALETTE.length];
}
// Leaderboard rows carry in-game names; match them to party members.
function memberByName(n) {
  return party.members.find(m => m.id !== party.id && ((m.ign && m.ign === n) || m.name === n));
}

const fmt = n => {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
};
const ago = ts => {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};
const dur = ms => {
  const s = Math.round(ms / 1000);
  return s >= 60 ? Math.floor(s / 60) + "m " + (s % 60) + "s" : s + "s";
};
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let justTs = 0; // ts of a loot entry that just arrived over SSE → pop-in once

const dayKey = ts => {
  const d = new Date(ts);
  return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
};
const dayLabel = ts => {
  const d = new Date(ts), now = new Date();
  const k = dayKey(ts);
  if (k === dayKey(now.getTime())) return "Today";
  if (k === dayKey(now.getTime() - 86400000)) return "Yesterday";
  const opts = { weekday: "short", month: "short", day: "numeric" };
  if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
};

// A member's death, rendered as a card: who + killer, the character, its
// gear, everything carried, and the n/8 maxed badge.
const deathRow = (l, plain) => {
  const c = !plain && party.joined ? memberColor(l.fromId || party.id) : null;
  const slots = arr => (arr || []).map(i => i.id > 0
    ? `<span class="slot" title="${esc(i.name || "")}"><img src="/icon/${i.id}" alt=""
         onerror="this.parentElement.classList.add('empty');this.remove()"></span>`
    : '<span class="slot empty"></span>').join("");
  const carried = (l.backpack || []).filter(i => i.id > 0);
  return `
    <div class="death-row"${c ? ` style="border-left:3px solid ${c}"` : ""}>
      <div class="d-head">
        <span class="d-skull">☠</span>
        ${l.icon > 0 ? `<img class="d-ava" src="/icon/${l.icon}" alt="" onerror="this.remove()">` : ""}
        <div class="d-who">
          <div class="d-name">${esc(l.name || "Unknown")}${l.from && l.fromId !== party.id
            ? ` <span class="from-chip"${c ? ` style="background:${c}"` : ""}>${esc(l.from)}</span>` : ""}</div>
          <div class="d-cause">killed by <b>${esc(l.killedBy || "?")}</b></div>
        </div>
        <div class="d-badges">
          ${l.maxed >= 0 ? `<span class="d-badge${l.maxed >= 8 ? " maxed8" : ""}">${l.maxed}/8</span>` : ""}
          ${l.fame > 0 ? `<span class="d-badge">${fmt(l.fame)} fame</span>` : ""}
          ${plain ? "" : tlHeart(l)}
        </div>
      </div>
      <div class="d-gear">${slots(l.equip)}${carried.length
        ? '<span class="gsep"></span>' + slots(carried) : ""}</div>
      <div class="loot-meta">${esc(l.map || "")} · ${ago(l.ts)}</div>
    </div>`;
};

const lootRow = (l, plain) => {
  // In a party every drop wears its owner's color on the left edge
  // (gold = you, palette color = that member).
  const c = !plain && party.joined ? memberColor(l.fromId || party.id) : null;
  const edge = c ? `border-left:3px solid ${c};${l.shiny ? "" : "padding-left:9px"}` : "";
  return `
    <div class="loot-row${l.shiny ? " shiny" : ""}${l.ts === justTs ? " pop" : ""}"${
      edge ? ` style="${edge}"` : ""}>
      <span class="bag-chip bag-${l.tier}"><span class="bagwrap">${
        l.bagType ? `<img class="sprite" src="/icon/${l.bagType}" alt=""
          onerror="this.insertAdjacentHTML('afterend','&lt;span class=&quot;swatch&quot;&gt;&lt;/span&gt;');this.remove()">`
                  : '<span class="swatch"></span>'}</span>${
        (l.boosted ? "B. " : "") + l.tier.toUpperCase()}</span>
      <div class="loot-items">
        <div class="item">${l.items.map(i => {
          const n = Math.min(i.slots || 0, 4);
          return `<span class="itm${i.shiny ? " shiny" : ""}${n ? " ench" + n : ""}"${
            n ? ` title="${n} enchantment slot${n > 1 ? "s" : ""}"` : ""
          }><span class="iwrap"><img class="sprite" src="/icon/${i.id}" alt=""
             onerror="this.remove()">${
            n ? `<span class="ench e${n}">${"<i></i>".repeat(n)}</span>` : ""
          }</span>${esc(i.name)}</span>`; }).join("")}</div>
        <div class="loot-meta">${l.from && l.fromId !== party.id
          ? `<span class="from-chip"${c ? ` style="background:${c}"` : ""}>${esc(l.from)}</span> · ` : ""}${esc(l.map || "")} · ${ago(l.ts)}</div>
      </div>${plain ? "" : tlHeart(l)}
    </div>`;
};

// Own timeline (drops + deaths) plus party members' events, newest first.
function combinedLoot() {
  const remote = party.events.filter(e =>
      (e.t === "loot" || e.t === "death") && e.fromId !== party.id);
  const all = remote.length
      ? lootLog.concat(remote).slice().sort((a, b) => b.ts - a.ts).slice(0, 2000)
      : lootLog;
  if (tlFilter === "deaths") {
    // "your deaths": own entries only
    return all.filter(l => (l.type === "death" || l.t === "death") && !l.from);
  }
  if (tlFilter === "liked") {
    return all.filter(l => l.liked);
  }
  return all;
}

function setTlFilter(f) {
  tlFilter = f;
  [...$("tlSeg").children].forEach(b =>
      b.classList.toggle("on", b.dataset.f === f));
  renderLoot();
}

// Heart on an own timeline entry: persists locally and (when in a guild)
// mirrors onto our guild event so it shows in the guild's Liked list.
async function tlLike(ts, on) {
  const e = lootLog.find(l => l.ts === ts);
  if (e) { if (on) e.liked = true; else delete e.liked; }
  renderLoot();
  try { await api("/timeline/like", { ts, on }); } catch (err) {}
}
const tlHeart = l => l.from ? "" : `
  <button class="heart tl-heart${l.liked ? " liked" : ""}"
    onclick="tlLike(${l.ts}, ${l.liked ? "false" : "true"})">${l.liked ? "♥" : "♡"}</button>`;

const isDeath = l => l.type === "death" || l.t === "death";

function renderLoot() {
  const el = $("loot");
  const list = combinedLoot();
  if (!list.length) {
    el.innerHTML = `<div class="empty">${tlFilter === "deaths"
        ? "No deaths recorded. Long may it last."
        : "No drops yet."}</div>`;
    return;
  }
  // A divider line marks each day boundary; today's group at the very top
  // needs none (the panel header covers it), but if the newest loot is
  // older, label it so the age is obvious.
  let html = "", prevKey = null;
  for (const l of list) {
    const k = dayKey(l.ts);
    if (k !== prevKey && (prevKey !== null || dayLabel(l.ts) !== "Today")) {
      html += `<div class="day-sep">${dayLabel(l.ts)}</div>`;
    }
    prevKey = k;
    html += isDeath(l) ? deathRow(l) : lootRow(l);
  }
  el.innerHTML = html;
  justTs = 0;
}

let toastTimer = null;
function showShinyToast(l) {
  const names = l.items.filter(i => i.shiny).map(i => esc(i.name)).join(", ");
  const icon = l.items.find(i => i.shiny);
  const t = $("shinyToast");
  t.innerHTML = `✦ Shiny drop! ${icon ? `<img class="sprite" src="/icon/${icon.id}" alt=""
    onerror="this.remove()">` : ""}<span>${names}</span>`;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 5000);
}

// Recent bosses: one card per fight. Solo it's just your line; in a party
// every member's line for that fight (same boss name within 3 minutes)
// stacks in the same card, each in their color. Own kills come both from
// the persisted bossLog and the relay echo — deduped by timestamp.
function recentBossGroups() {
  const evs = [];
  const seen = new Set();
  if (party.joined) {
    for (const e of party.events) {
      if (e.t !== "boss") continue;
      evs.push(e);
      seen.add((e.fromId || "") + "|" + e.ts);
    }
  }
  for (const b of bossLog) {
    if (!seen.has((party.id || "") + "|" + b.ts)) {
      evs.push({ ...b, fromId: party.id || "me", from: "You" });
    }
  }
  evs.sort((a, b) => b.ts - a.ts);
  const groups = [];
  for (const e of evs) {
    const g = groups.find(g => g.name === e.name && Math.abs(g.ts - e.ts) < 180000);
    if (g) {
      if (!g.lines.some(l => l.fromId === e.fromId)) g.lines.push(e);
    } else {
      groups.push({ name: e.name, icon: e.icon, ts: e.ts, lines: [e] });
    }
  }
  return groups.slice(0, 5);
}

function recentBossesHtml() {
  const groups = recentBossGroups();
  if (!groups.length) return "";
  const cards = groups.map(g => `
    <div class="pb-card">
      <div class="pb-head">
        ${g.icon > 0 ? `<img src="/icon/${g.icon}" alt="" onerror="this.remove()">` : ""}
        <span class="pb-name">${esc(g.name)}</span>
        <span class="bl-ago">${ago(g.ts)}</span>
      </div>
      ${g.lines.slice().sort((a, b) => (b.myDmg || 0) - (a.myDmg || 0)).map(l => {
        const pct = l.total > 0 ? Math.round(100 * (l.myDmg || 0) / l.total) : 0;
        const me = !party.joined || l.fromId === party.id;
        const c = me ? null : memberColor(l.fromId);
        return `
      <div class="pb-line${me ? " me" : ""}">
        <span class="pb-who"${c ? ` style="color:${c}"` : ""}>${esc(me ? "You" : l.from || "?")}</span>
        <span class="pb-rank"${c ? ` style="color:${c}"` : ""}>${l.myRank ? "#" + l.myRank : "—"}</span>
        <div class="track"><div class="fill" style="width:${Math.max(2, pct)}%${c ? `;background:${c}` : ""}"></div></div>
        <span class="pb-nums">${fmt(l.myDmg || 0)}<span class="pct">${pct}%</span></span>
      </div>`; }).join("")}
    </div>`).join("");
  return `
    <div class="bl-toggle${bossLogOpen ? " open" : ""}" onclick="toggleBossLog()">
      Recent Bosses <span class="bl-count">${groups.length}</span><span class="chev">▾</span>
    </div>
    <div${bossLogOpen ? "" : " hidden"}>${cards}</div>`;
}
function toggleBossLog() {
  bossLogOpen = !bossLogOpen;
  renderBoss();
}

// A party member's own tracker saw their whole fight; ours may have joined
// late and missed damage (wrong rank/amount for them). Their self-reported
// boss line for this fight is authoritative — find it by boss name + time.
function authLineFor(name, bossName, ts) {
  const m = memberByName(name);
  if (!m) return null;
  let best = null;
  for (const e of party.events) {
    if (e.t !== "boss" || e.fromId !== m.id || e.name !== bossName) continue;
    if (Math.abs(e.ts - ts) < 180000
        && (!best || Math.abs(e.ts - ts) < Math.abs(best.ts - ts))) best = e;
  }
  return best;
}

function renderBoss() {
  const el = $("boss");
  if (!boss) {
    el.innerHTML = '<div class="empty">No boss kills recorded yet.</div>'
      + recentBossesHtml();
    return;
  }
  // rank/loadout arrived with newer builds; default them for old snapshots.
  const rows = boss.top.map((t, i) => {
    const r = { ...t, rank: t.rank || i + 1 };
    if (party.joined && !r.me) {
      const auth = authLineFor(r.name, boss.name, boss.ts);
      if (auth) {
        r.dmg = auth.myDmg || 0;
        if (auth.myRank) r.rank = auth.myRank;
        r.authTotal = auth.total; // their % is against THEIR seen total
      }
    }
    return r;
  });
  rows.sort((a, b) => a.rank - b.rank || b.dmg - a.dmg);
  const main = rows.filter(r => r.rank <= 5);
  // Below-top-5 rows: us and/or party members, under a separator.
  const mine = rows.filter(r => r.rank > 5);
  const max = Math.max(1, ...rows.map(t => t.dmg));

  const slots = t => {
    const lo = t.loadout && t.loadout.length ? t.loadout : [{}, {}, {}, {}];
    return lo.map(s => s.id > 0
      ? `<span class="slot" title="${esc(s.name || "")}"><img src="/icon/${s.id}" alt=""
           onerror="this.parentElement.classList.add('empty');this.remove()"></span>`
      : '<span class="slot empty"></span>').join("");
  };
  const card = t => {
    // A party member's card wears their color (border, bar, name chip);
    // your own card keeps its gold "me" treatment.
    const m = !t.me && party.joined ? memberByName(t.name) : null;
    const c = m ? memberColor(m.id) : null;
    return `
    <div class="p-card${t.me ? " me" : ""}"${c ? ` style="border-color:${c}"` : ""} title="${t.dmg.toLocaleString()} damage">
      <div class="p-avatar">${t.icon > 0
        ? `<img src="/icon/${t.icon}" alt=""${c ? ` style="border-radius:6px;outline:1px solid ${c}"` : ""}
             onerror="this.insertAdjacentHTML('afterend','&lt;span class=&quot;blank&quot;&gt;&lt;/span&gt;');this.remove()">`
        : '<span class="blank"></span>'}</div>
      <div class="p-body">
        <div class="p-top">
          <span class="rank">#${t.rank}</span>
          <span class="pname">${esc(t.name)}${t.me ? '<span class="you-chip">YOU</span>' : ""}${
            c ? `<span class="you-chip" style="background:${c}">PARTY</span>` : ""}</span>
          <span class="dval">${fmt(t.dmg)}<span class="pct">${
            Math.round(100 * t.dmg / Math.max(1, t.authTotal || boss.total))}%</span></span>
        </div>
        <div class="track"><div class="fill" style="width:${
          Math.max(2, 100 * t.dmg / max)}%${c ? `;background:${c}` : ""}"></div></div>
        <div class="p-loadout">${slots(t)}</div>
      </div>
    </div>`;
  };

  el.innerHTML = `
    <div class="boss-head">
      ${boss.icon > 0 ? `<img class="sprite" src="/icon/${boss.icon}" alt=""
        onerror="this.remove()">` : ""}
      <div>
        <div class="boss-name">${esc(boss.name)}</div>
        <div class="boss-meta">${fmt(boss.total)} total tracked damage · fight ${
          dur(boss.fightMs)} · ${esc(boss.map || "")} · ${ago(boss.ts)}</div>
      </div>
    </div>` +
    main.map(card).join("") +
    (mine.length ? '<div class="me-sep"></div>' + mine.map(card).join("") : "") +
    recentBossesHtml();
}

function setMap(name) {
  $("map").textContent = name || "";
}

// ---- Party UI (lives in the sidebar left of the timeline) ----
function renderRoster() {
  const box = $("partyTiles");
  if (!party.joined || !party.members.length) {
    box.innerHTML = "";
    return;
  }
  box.innerHTML = party.members.map(m => {
    const me = m.id === party.id;
    const c = me ? YOU_COLOR : memberColor(m.id);
    return `<div class="pm-tile" style="border-color:${c}">
      <span class="pm-ava">${m.icon > 0
        ? `<img src="/icon/${m.icon}" alt="" onerror="this.remove()">` : ""}</span>
      <span class="pm-name" style="color:${c}">${esc(m.name)}</span>
      ${me ? '<span class="pm-you">YOU</span>' : ""}
    </div>`;
  }).join("");
}

function renderParty() {
  renderRoster();
  const chip = $("partyChip");
  if (party.joined) {
    chip.className = "party-btn" + (party.connected ? " in" : "");
    chip.textContent = `⬡ ${party.code}`;
  } else {
    chip.className = "party-btn";
    chip.textContent = "Party";
  }
  const pop = $("partyPop");
  pop.hidden = !partyPopOpen;
  if (!partyPopOpen) return;
  if (!party.joined) {
    pop.innerHTML = `
      <h3>Join a party</h3>
      <input id="pName" maxlength="24" placeholder="Your name"
        value="${esc(localStorage.getItem("partyName") || myAccountName || party.name || "")}">
      <input id="pCode" maxlength="12" placeholder="Party code (empty = new party)"
        style="text-transform:uppercase">
      <div class="party-btns">
        <button onclick="partyJoin(false)">Join</button>
        <button class="ghost" onclick="partyJoin(true)">Create new</button>
      </div>
      <div class="party-err" id="partyErr"></div>`;
  } else {
    const rows = party.members.map(m => `
      <div class="party-member${m.id === party.id ? " you-row" : ""}">
        <span class="dot"></span>${esc(m.name)}${m.id === party.id ? " (you)" : ""}
      </div>`).join("");
    pop.innerHTML = `
      <h3>Party</h3>
      <div class="party-code-row">
        <span class="party-code" title="Click to copy"
          onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(party.code)}')">${esc(party.code)}</span>
        <span class="hint">share this code${party.connected ? "" : " · reconnecting…"}</span>
      </div>
      ${rows || '<div class="party-member">connecting…</div>'}
      <div class="party-btns" style="margin-top:10px">
        <button class="danger" onclick="partyLeave()">Leave party</button>
      </div>`;
  }
}
function togglePartyPop() {
  partyPopOpen = !partyPopOpen;
  renderParty();
}
async function partyJoin(createNew) {
  const name = $("pName").value.trim();
  const code = createNew ? "" : $("pCode").value.trim();
  if (!name) { $("partyErr").textContent = "Enter a name first."; return; }
  if (!createNew && !code) { $("partyErr").textContent = "Enter a code, or Create new."; return; }
  try { localStorage.setItem("partyName", name); } catch (e) {}
  $("partyErr").textContent = "Connecting…";
  try {
    const r = await fetch("/party/join", { method: "POST",
      body: JSON.stringify({ name, code }) }).then(r => r.json());
    if (!r.ok) { $("partyErr").textContent = r.error || "Failed."; return; }
    party.joined = true;
    party.code = r.code;
    party.name = name;
    renderParty();
  } catch (e) {
    $("partyErr").textContent = "Tracker unreachable.";
  }
}
async function partyLeave() {
  try { await fetch("/party/leave", { method: "POST" }); } catch (e) {}
  party = { ...party, joined: false, connected: false, code: "", members: [], events: [] };
  partySeen.clear();
  partyPopOpen = false;
  renderParty(); renderLoot(); renderBoss();
}

function addPartyEvent(e) {
  const k = e.t + "|" + e.fromId + "|" + e.ts;
  if (partySeen.has(k)) return false;
  partySeen.add(k);
  party.events.push(e);
  if (party.events.length > 300) party.events.shift();
  return true;
}
function applyPartyFrame(f) {
  if (f.t === "members") {
    party.members = f.members || [];
    // membership changes can reshuffle colors — repaint everything
    renderParty(); renderLoot(); renderBoss();
  } else if (f.t === "history") {
    let any = false;
    for (const e of f.events || []) any = addPartyEvent(e) || any;
    if (any) { renderLoot(); renderBoss(); }
  } else if (f.t === "loot" || f.t === "boss" || f.t === "death") {
    if (addPartyEvent(f)) {
      if (f.t === "boss") renderBoss(); else renderLoot();
    }
  }
}

// ---- View switching + Account + Guild ----
function setView(v) {
  view = v;
  $("navTracker").classList.toggle("on", v === "tracker");
  $("navGuild").classList.toggle("on", v === "guild");
  $("viewTracker").hidden = v !== "tracker";
  $("viewGuild").hidden = v !== "guild";
  $("viewAccount").hidden = v !== "account";
  $("viewSettings").hidden = v !== "settings";
  if (v === "guild") refreshGuild();
  if (v === "account") loadAccount();
  if (v === "settings") loadSettings();
}

async function loadSettings() {
  try {
    const s = await api("/settings/status");
    if (s.ok) {
      $("setAutoLaunch").checked = !!s.autoLaunch;
      $("setAutoLaunch").disabled = !s.autoLaunchSupported;
      $("setOk").textContent = s.autoLaunchSupported ? "" : "Windows only.";
    }
  } catch (e) {}
}
async function toggleAutoLaunch() {
  const on = $("setAutoLaunch").checked;
  const r = await api("/settings/autolaunch", { on });
  if (r.ok) {
    $("setAutoLaunch").checked = !!r.autoLaunch;
    $("setOk").textContent = r.autoLaunch
        ? "On — Realmscry will start with the game." : "Off.";
  } else {
    $("setAutoLaunch").checked = !on;
    $("setOk").textContent = r.error || "Failed.";
  }
}

let myAccountName = "";
function toggleAcctPop() {
  $("acctPop").hidden = !$("acctPop").hidden;
}
async function loadAccount() {
  try {
    const s = await api("/account/status");
    if (s.ok) {
      myAccountName = s.name || "";
      $("acctName").value = myAccountName;
      $("acctIgn").textContent = s.ign
          ? "Detected in game: " + s.ign : "In-game name not detected yet (enter a map).";
      $("acctOk").textContent = "";
    }
  } catch (e) {}
}
async function saveAcctName() {
  const name = $("acctName").value.trim();
  const r = await api("/account/name", { name });
  if (r.ok) {
    myAccountName = r.name || name;
    $("acctOk").textContent = "Saved.";
    setTimeout(() => { $("acctOk").textContent = ""; }, 3000);
  } else {
    $("acctOk").textContent = r.error || "Could not save.";
  }
}

async function api(path, body) {
  const opts = body !== undefined
      ? { method: "POST", body: JSON.stringify(body) } : {};
  const r = await fetch(path, opts);
  return r.json();
}

async function refreshGuild() {
  try {
    const s = await api("/guild/status");
    guild.loaded = true;
    guild.error = "";
    if (s.ok === false && s.error && !String(s.error).startsWith("no account")) {
      guild.error = s.error;
    }
    guild.inGuild = !!s.inGuild;
    if (s.inGuild) {
      guild.name = s.name; guild.code = s.code; guild.role = s.role;
      guild.accountId = s.accountId; guild.members = s.members || [];
      const t = await api("/guild/timeline?filter=" + guild.filter);
      if (t.ok) { guild.events = t.events || []; guild.accountId = t.accountId || guild.accountId; }
      else guild.error = t.error || "";
    }
  } catch (e) {
    guild.error = "tracker unreachable";
  }
  renderGuild();
}

function setGuildFilter(f) {
  guild.filter = f;
  refreshGuild();
}

async function guildCreate() {
  const name = $("gName").value.trim();
  if (name.length < 2) { $("gErr").textContent = "Guild name too short."; return; }
  $("gErr").textContent = "Creating…";
  const r = await api("/guild/create", { name });
  if (!r.ok) { $("gErr").textContent = r.error || "Failed."; return; }
  refreshGuild();
}
async function guildJoin() {
  const code = $("gCode").value.trim();
  if (!code) { $("gErr2").textContent = "Enter an invite code."; return; }
  $("gErr2").textContent = "Joining…";
  const r = await api("/guild/join", { code });
  if (!r.ok) { $("gErr2").textContent = r.error || "Failed."; return; }
  refreshGuild();
}
async function guildLeave() {
  if (!confirm("Leave " + guild.name + "?")) return;
  await api("/guild/leave", {});
  guild.inGuild = false;
  refreshGuild();
}
async function guildLike(eventId, on) {
  const e0 = guild.events.find(x => x.id === eventId);
  const r = await api("/guild/like", { eventId, on });
  if (r.ok) {
    const e = guild.events.find(x => x.id === eventId);
    if (e) { e.likes = r.likes; e.likedByMe = on ? 1 : 0; }
    if (guild.filter === "liked" && !on) {
      guild.events = guild.events.filter(x => x.id !== eventId || x.likes > 0);
    }
    renderGuild();
    // Liking MY OWN event in the guild also hearts it in my tracker
    // timeline; other members' events never touch the local timeline.
    if (e0 && e0.mine && e0.data && e0.data.ts) tlLike(e0.data.ts, on);
  }
}

function guildEventHtml(e) {
  const d = { ...e.data, ts: e.data.ts || e.ts };
  delete d.from; delete d.fromId; // no party colors inside the guild view
  const body = e.type === "death" ? deathRow(d, true) : lootRow(d, true);
  return `
    <div class="g-ev">
      <div class="g-ev-head">
        ${e.icon > 0 ? `<img src="/icon/${e.icon}" alt="" onerror="this.remove()">` : ""}
        <span class="gname">${esc(e.dname || e.ign || "Unknown")}${e.mine ? " (you)" : ""}</span>
        <span class="gago">${ago(e.ts)}</span>
        <button class="heart${e.likedByMe ? " liked" : ""}"
          onclick="guildLike(${e.id}, ${e.likedByMe ? "false" : "true"})">
          ${e.likedByMe ? "♥" : "♡"}${e.likes > 0 ? " " + e.likes : ""}</button>
      </div>
      ${body}
    </div>`;
}

function renderGuild() {
  const el = $("viewGuild");
  if (!guild.loaded) {
    el.innerHTML = '<section class="card"><div class="empty">Loading guild…</div></section>';
    return;
  }
  if (!guild.inGuild) {
    el.innerHTML = `
      <div class="guild-forms">
        <section class="card">
          <h2>Create a guild</h2>
          <input id="gName" maxlength="24" placeholder="Guild name">
          <button onclick="guildCreate()">Create guild</button>
          <div class="g-hint">You become the owner and get an invite code to share.</div>
          <div class="g-err" id="gErr">${esc(guild.error || "")}</div>
        </section>
        <section class="card">
          <h2>Join a guild</h2>
          <input id="gCode" maxlength="12" placeholder="Invite code" style="text-transform:uppercase">
          <button onclick="guildJoin()">Join guild</button>
          <div class="g-hint">Ask a member for the guild's invite code.</div>
          <div class="g-err" id="gErr2"></div>
        </section>
      </div>`;
    return;
  }
  const members = guild.members.map(m => `
    <span class="g-member">
      ${m.icon > 0 ? `<img src="/icon/${m.icon}" alt="" onerror="this.remove()">` : ""}
      ${m.role === "owner" ? '<span class="crown" title="Owner">♛</span>' : ""}
      ${esc(m.name || m.ign || "Unknown")}${m.id === guild.accountId ? " (you)" : ""}
    </span>`).join("");
  const evs = guild.events.length
      ? guild.events.map(guildEventHtml).join("")
      : `<div class="empty">${guild.filter === "liked"
          ? "Nothing liked yet — hit the ♡ on a drop worth keeping."
          : guild.filter === "deaths" ? "No deaths recorded. A disciplined guild."
          : "No guild activity yet. Drops and deaths land here as members play."}</div>`;
  el.innerHTML = `
    <section class="card g-info">
      <div class="g-info-top">
        <span class="g-name">${esc(guild.name)}</span>
        <span class="g-code" title="Click to copy the invite code"
          onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(guild.code)}')">${esc(guild.code)}</span>
        <span class="g-hint" style="margin-top:0">invite code · click to copy</span>
        <button class="g-btn ghost" style="margin-left:auto" onclick="guildLeave()">Leave</button>
      </div>
      <div class="g-roster">${members}</div>
    </section>
    <section class="card g-tl-card">
      <div class="card-head">
        <h2>Guild Timeline</h2>
        <div class="seg">
          <button class="${guild.filter === "all" ? "on" : ""}" onclick="setGuildFilter('all')">All</button>
          <button class="${guild.filter === "liked" ? "on" : ""}" onclick="setGuildFilter('liked')">Liked</button>
          <button class="${guild.filter === "deaths" ? "on" : ""}" onclick="setGuildFilter('deaths')">Deaths</button>
        </div>
      </div>
      <div id="gtl">${evs}</div>
    </section>`;
}

function connect() {
  const es = new EventSource("/events");
  es.onopen = () => {
    $("conn").classList.add("live");
    $("connText").textContent = "live";
  };
  es.onerror = () => {
    $("conn").classList.remove("live");
    $("connText").textContent = "reconnecting…";
  };
  es.addEventListener("snapshot", e => {
    const d = JSON.parse(e.data);
    lootLog = d.loot || [];
    boss = d.boss || null;
    bossLog = d.bossLog || [];
    if (d.party) {
      party = { ...d.party, events: [] };
      partySeen.clear();
      for (const ev of d.party.events || []) addPartyEvent(ev);
    }
    setMap(d.map);
    renderLoot(); renderBoss(); renderParty();
  });
  es.addEventListener("bosslog", e => {
    bossLog = JSON.parse(e.data);
    renderBoss();
  });
  es.addEventListener("death", e => {
    const d = JSON.parse(e.data);
    lootLog.unshift(d);
    if (lootLog.length > 2000) lootLog.pop();
    renderLoot();
  });
  es.addEventListener("party", e => applyPartyFrame(JSON.parse(e.data)));
  es.addEventListener("partystatus", e => {
    const d = JSON.parse(e.data);
    party.joined = d.joined; party.connected = d.connected;
    party.code = d.code; party.name = d.name; party.id = d.id;
    party.members = d.members || party.members;
    renderParty(); renderLoot(); renderBoss();
  });
  es.addEventListener("loot", e => {
    const d = JSON.parse(e.data);
    lootLog.unshift(d);
    if (lootLog.length > 2000) lootLog.pop();
    justTs = d.ts;
    renderLoot();
    if (d.shiny) showShinyToast(d);
  });
  es.addEventListener("boss", e => {
    boss = JSON.parse(e.data);
    renderBoss();
  });
  es.addEventListener("map", e => setMap(JSON.parse(e.data).map));
}
connect();
loadAccount(); // prefills the account page + party-name suggestions
setInterval(() => {
  if (view === "guild") { refreshGuild(); return; }
  renderLoot();
  if (boss || bossLog.length) renderBoss();
}, 30000);
</script>
